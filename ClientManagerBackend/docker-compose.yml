version: "3.9"

services:
  clientmanager-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Debug
    container_name: clientmanager-api
    ports:
      - "8080:44345"  # host 8080 -> container 44345
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DbConnection=Server=sqlserver-db,1433;Database=ClientManagerDb;User Id=sa;Password=Interit_123;Encrypt=False;TrustServerCertificate=True;
    depends_on:
      sqlserver-db:
        condition: service_healthy
    restart: on-failure

  sqlserver-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver172026-wvol
    environment:
      SA_PASSWORD: "Interit_123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Interit_123", "-Q", "SELECT 1", "-C", "-b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data: